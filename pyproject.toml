[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "uniqpath"
version = "0.2.0"
description = "Avoid overwriting files: unique filename or directory paths, atomically reserved for concurrent jobs."
authors = [{ name = "Julien Rabault", email = "julienrabault@icloud.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = [
    "path",
    "unique",
    "filename",
    "unique-filename",
    "file",
    "directory",
    "overwrite",
    "suffix",
    "atomic",
    "concurrency",
    "filesystem",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/JulienRabault/uniqpath"
Source = "https://github.com/JulienRabault/uniqpath"
Issues = "https://github.com/JulienRabault/uniqpath/issues"
Changelog = "https://github.com/JulienRabault/uniqpath/blob/main/CHANGELOG.md"

[project.scripts]
uniqpath = "uniqpath.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.16,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/uniqpath"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["uniqpath"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]
# Ruff 0.16+ formats Python blocks inside Markdown. The README aligns its
# inline comments into columns on purpose, so keep prose out of its reach.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PTH"]

[tool.mypy]
python_version = "3.9"
files = ["src"]
strict = true
warn_unreachable = true
